<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析可视化 - Data Analytics</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/sql-wasm.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 数据分析可视化</h1>
            <p class="subtitle">实时查看直播弹幕数据分析结果</p>
        </header>

        <div class="upload-section">
            <div class="upload-box">
                <input type="file" id="dbFile" accept=".db" style="display: none;">
                <button id="selectFileBtn" class="btn btn-primary">
                    <span>📁</span> 选择数据库文件
                </button>
                <span id="fileName" class="file-name"></span>
            </div>
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <span>正在加载数据库...</span>
            </div>
        </div>

        <div id="content" style="display: none;">
            <!-- 筛选器 -->
            <div class="filters-section">
                <div class="filter-group">
                    <label for="roomSelect">选择房间：</label>
                    <select id="roomSelect" class="select">
                        <option value="">全部房间</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="startDate">开始时间：</label>
                    <input type="datetime-local" id="startDate" class="datetime-input">
                </div>
                <div class="filter-group">
                    <label for="endDate">结束时间：</label>
                    <input type="datetime-local" id="endDate" class="datetime-input">
                </div>
                <div class="filter-group quick-buttons">
                    <button class="btn-quick" data-range="today">今天</button>
                    <button class="btn-quick" data-range="yesterday">昨天</button>
                    <button class="btn-quick" data-range="last7days">最近7天</button>
                    <button class="btn-quick" data-range="last30days">最近30天</button>
                    <button class="btn-quick" data-range="all">全部</button>
                </div>
                <button id="refreshBtn" class="btn btn-secondary">🔄 刷新数据</button>
            </div>

            <!-- 概览统计 -->
            <section class="stats-overview">
                <h2>📈 数据概览</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">💬</div>
                        <div class="stat-content">
                            <div class="stat-label">弹幕总数</div>
                            <div class="stat-value" id="statDanmaku">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🎁</div>
                        <div class="stat-content">
                            <div class="stat-label">礼物总数</div>
                            <div class="stat-value" id="statGift">0</div>
                            <div class="stat-sub">价值: <span id="statGiftValue">0</span> 元</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⚓</div>
                        <div class="stat-content">
                            <div class="stat-label">上舰总数</div>
                            <div class="stat-value" id="statMember">0</div>
                            <div class="stat-sub">价值: <span id="statMemberValue">0</span> 元</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">💎</div>
                        <div class="stat-content">
                            <div class="stat-label">醒目留言</div>
                            <div class="stat-value" id="statSuperChat">0</div>
                            <div class="stat-sub">价值: <span id="statSuperChatValue">0</span> 元</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 图表区域 -->
            <div class="charts-grid">
                <!-- 弹幕时间分布 -->
                <section class="chart-section">
                    <h3>📝 弹幕时间分布</h3>
                    <canvas id="danmakuTimeChart"></canvas>
                </section>

                <!-- 礼物统计 -->
                <section class="chart-section">
                    <h3>🎁 礼物统计</h3>
                    <canvas id="giftChart"></canvas>
                </section>

                <!-- 用户类型分布 -->
                <section class="chart-section">
                    <h3>👥 用户类型分布</h3>
                    <canvas id="userTypeChart"></canvas>
                </section>

                <!-- 收入统计 -->
                <section class="chart-section">
                    <h3>💰 收入统计</h3>
                    <canvas id="revenueChart"></canvas>
                </section>
            </div>

            <!-- 排行榜 -->
            <div class="tables-grid">
                <!-- 活跃用户排行 -->
                <section class="table-section">
                    <h3>👥 活跃用户 TOP 20</h3>
                    <div class="table-container">
                        <table id="activeUsersTable">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>用户名</th>
                                    <th>弹幕数</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </section>

                <!-- 礼物排行 -->
                <section class="table-section">
                    <h3>🎁 礼物排行 TOP 20</h3>
                    <div class="table-container">
                        <table id="giftRankTable">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>礼物名称</th>
                                    <th>数量</th>
                                    <th>价值(元)</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>

        <footer>
            <p>Data Analytics Plugin - 静态数据分析工具</p>
        </footer>
    </div>

    <script src="js/db.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
