<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>排队管理器</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <h1>排队管理器</h1>
    <section class="card">
      <h2>房间与队列</h2>
      <label>roomKey <input id="roomKeyInput" value="all" /></label>
      <button id="refreshBtn">刷新</button>
      <button id="passNextBtn">过号</button>
      <label>userKey <input id="removeUserKey" placeholder="要移除的 userKey" /></label>
      <button id="removeUserBtn">移除</button>
      <pre id="queueMeta"></pre>
      <table>
        <thead>
          <tr><th>#</th><th>用户</th><th>礼物值</th><th>报名时间</th><th>userKey</th></tr>
        </thead>
        <tbody id="queueTableBody"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>入队限制</h2>
      <label><input type="checkbox" id="requireFansMedal" /> 仅粉丝团</label>
      <label>粉丝团等级 >= <input type="number" id="minFansLevel" min="0" /></label>
      <label><input type="checkbox" id="requireGuard" /> 仅舰队</label>
      <label>舰队等级 >= <input type="number" id="minGuardLevel" min="1" /></label>
      <label>最大队列长度 <input type="number" id="maxQueueSize" min="1" /></label>
      <button id="saveSettingsBtn">保存设置</button>
    </section>

    <section class="card">
      <h2>OBS 链接</h2>
      <pre id="overlayUrl"></pre>
    </section>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
