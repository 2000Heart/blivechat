<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抖音直播管理</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #1f2328;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 28px 16px 56px; }
    h1 { font-size: 32px; line-height: 1.25; margin: 0 0 20px; }
    section {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h2 { font-size: 20px; line-height: 1.3; margin: 0 0 12px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }
    .stat { background: #f6f8fa; border-radius: 8px; padding: 10px 12px; }
    .stat b { display: block; font-size: 16px; font-weight: 600; color: #656d76; }
    .stat span { display: block; margin-top: 4px; font-size: 20px; line-height: 1.3; }
    .field { display: block; margin: 12px 0 4px; font-size: 16px; font-weight: 600; }
    input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 88px; resize: vertical; }
    .checks { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 8px; }
    .checks label { display: flex; align-items: center; gap: 6px; font-weight: 500; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    button {
      font: inherit;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #d0d7de;
      background: #fff;
      cursor: pointer;
    }
    button.primary { background: #0969da; border-color: #0969da; color: #fff; }
    .error { min-height: 1.5em; margin: 12px 0 0; color: #cf222e; }
    table { width: 100%; border-collapse: collapse; font-size: 16px; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #eef0f2; vertical-align: top; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0d1117;
      color: #e6edf3;
      padding: 12px;
      border-radius: 8px;
      max-height: 320px;
      overflow: auto;
      margin: 0;
      font-size: 16px;
    }
  </style>
</head>
<body>
<main>
  <h1>抖音直播管理</h1>
  <section>
    <h2>状态</h2>
    <div class="stats">
      <div class="stat"><b>引擎</b><span id="running">—</span></div>
      <div class="stat"><b>连接状态</b><span id="phase">—</span></div>
      <div class="stat"><b>已发送</b><span id="sent">0</span></div>
      <div class="stat"><b>丢弃</b><span id="dropped">0</span></div>
      <div class="stat"><b>队列长度</b><span id="queue">0</span></div>
      <div class="stat"><b>登录阶段</b><span id="login-phase">—</span></div>
    </div>
    <p class="error" id="error"></p>
  </section>
  <section>
    <h2>连接</h2>
    <label class="field" for="room">房间号</label>
    <input id="room" type="text" autocomplete="off">
    <label class="field" for="cookie">Cookie</label>
    <textarea id="cookie" autocomplete="off" spellcheck="false"></textarea>
    <div class="row">
      <button type="button" id="save" class="primary">保存</button>
      <button type="button" id="login">登录抖音</button>
      <button type="button" id="cancel-login">取消登录</button>
      <button type="button" id="connect">连接</button>
      <button type="button" id="disconnect">断开</button>
      <button type="button" id="restart">重启</button>
    </div>
  </section>
  <section>
    <h2>过滤</h2>
    <label class="field" for="prefix">内容前缀</label>
    <input id="prefix" type="text" autocomplete="off">
    <div class="checks">
      <label><input id="include-gift" type="checkbox">礼物</label>
      <label><input id="native-gift" type="checkbox">礼物样式</label>
      <label><input id="include-like" type="checkbox">点赞</label>
      <label><input id="include-member" type="checkbox">进场</label>
      <label><input id="include-social" type="checkbox">关注</label>
    </div>
  </section>
  <section>
    <h2>最近弹幕</h2>
    <table>
      <thead>
        <tr><th>时间</th><th>昵称</th><th>类型</th><th>文本</th></tr>
      </thead>
      <tbody id="messages"></tbody>
    </table>
  </section>
  <section>
    <h2>运行日志</h2>
    <pre id="logs"></pre>
  </section>
</main>
<script>
(function () {
  var PHASES = {
    idle: "空闲",
    waiting_live: "等待开播",
    connecting: "连接中",
    connected: "已连接",
    reconnecting: "重连中",
    disconnected: "已断开",
    need_login: "需要登录",
    refreshing: "续期中",
    error: "错误"
  };
  var LOGIN = {
    idle: "空闲",
    running: "登录中",
    done: "登录成功",
    need_login: "需要登录",
    error: "登录失败",
    cancelled: "已取消"
  };
  var KINDS = {
    text: "弹幕",
    gift: "礼物",
    like: "点赞",
    member: "进场",
    social: "关注"
  };
  var lastLoginPhase = null;
  var snapshotReady = false;

  function el(id) {
    return document.getElementById(id);
  }

  function setText(id, value) {
    el(id).textContent = value === undefined || value === null || value === "" ? "—" : String(value);
  }

  function renderStatus(data) {
    setText("running", data.running ? "运行中" : "已停止");
    setText("phase", PHASES[data.phase] || data.phase || "—");
    setText("sent", data.sent == null ? 0 : data.sent);
    setText("dropped", data.dropped == null ? 0 : data.dropped);
    setText("queue", data.queue_size == null ? 0 : data.queue_size);
    setText("login-phase", LOGIN[data.login_phase] || data.login_phase || "—");
    var body = el("messages");
    body.replaceChildren();
    (data.messages || []).forEach(function (item) {
      var tr = document.createElement("tr");
      var stamp = "";
      if (item.time) {
        var date = new Date(Number(item.time) * 1000);
        stamp = isNaN(date.getTime()) ? String(item.time) : date.toLocaleString();
      }
      var content = item.text || "";
      if (item.kind === "gift") {
        var extra = [item.gift_name || "", item.num == null ? "" : "×" + item.num].filter(Boolean).join(" ");
        content = extra ? (extra + (content ? " " + content : "")) : content;
      }
      [stamp, item.author_name || "", KINDS[item.kind] || item.kind || "", content].forEach(function (cell) {
        var td = document.createElement("td");
        td.textContent = cell;
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    el("logs").textContent = (data.logs || []).join("\n");
  }

  function fillInputs(data) {
    el("room").value = data.room_id || "";
    el("cookie").value = data.cookie || "";
    el("prefix").value = data.content_prefix || "";
    el("include-gift").checked = !!data.include_gift;
    el("native-gift").checked = !!data.native_gift;
    el("include-like").checked = !!data.include_like;
    el("include-member").checked = !!data.include_member;
    el("include-social").checked = !!data.include_social;
  }

  function loadSnapshot(fill) {
    return fetch("/admin/snapshot", {cache: "no-store"}).then(function (res) {
      return res.json();
    }).then(function (data) {
      renderStatus(data);
      if (fill) {
        fillInputs(data);
      }
      return data;
    });
  }

  function noteLogin(phase) {
    var previous = lastLoginPhase;
    lastLoginPhase = phase || "";
    if (previous !== "done" && phase === "done") {
      loadSnapshot(true);
    }
  }

  function postAction(body) {
    return fetch("/admin/action", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; });
    }).then(function (data) {
      el("error").textContent = data && data.ok === false ? (data.error || "操作失败") : "";
      return data;
    }).catch(function () {
      el("error").textContent = "操作失败";
    });
  }

  el("save").addEventListener("click", function () {
    postAction({
      action: "save_config",
      room_id: el("room").value.trim(),
      cookie: el("cookie").value,
      content_prefix: el("prefix").value,
      include_gift: el("include-gift").checked,
      native_gift: el("native-gift").checked,
      include_like: el("include-like").checked,
      include_member: el("include-member").checked,
      include_social: el("include-social").checked
    });
  });
  el("login").addEventListener("click", function () {
    postAction({action: "login_start"});
  });
  el("cancel-login").addEventListener("click", function () {
    postAction({action: "login_cancel"});
  });
  el("connect").addEventListener("click", function () {
    postAction({action: "connect"});
  });
  el("disconnect").addEventListener("click", function () {
    postAction({action: "disconnect"});
  });
  el("restart").addEventListener("click", function () {
    postAction({action: "restart"});
  });

  loadSnapshot(true).then(function (data) {
    lastLoginPhase = (data && data.login_phase) || "";
    snapshotReady = true;
  });

  var source = new EventSource("/admin/events");
  source.onmessage = function (ev) {
    var data;
    try {
      data = JSON.parse(ev.data);
    } catch (err) {
      return;
    }
    renderStatus(data);
    if (snapshotReady) {
      noteLogin(data.login_phase);
    }
  };
})();
</script>
</body>
</html>
