[relay]
# 管理页 HTTP 监听地址（仅允许回环地址）
admin_host = 127.0.0.1
admin_port = 18771
# 直播状态探测间隔（秒）
live_probe_interval_seconds = 180
# Node 可执行文件。用于启动 tsx 运行 headless。可填绝对路径；留空/默认时先尝试 dycast/.node 下的便携 Node，再回退系统 node
sidecar_node_exe = node
# 抖音房间号（留空则不探测、不连接）
douyin_room_id =
# 抖音请求头或 Cookie。获取方式：管理页登录成功后自动写入，或在此手动粘贴。
douyin_cookie =
cookie_auto_refresh = true
douyin_browser_profile_dir = data/douyin-browser-profile
cookie_login_timeout_seconds = 300
cookie_silent_timeout_seconds = 30

# 注入到弹幕内容前的前缀
content_prefix = 

# 除聊天外是否把下列事件降级为文本弹幕
include_gift = true
# 礼物是否用 blivechat 礼物样式（send_gift）；false 时礼物仍为一条文字弹幕
native_gift = true
include_like = false
include_member = true
include_social = true

# 去重：同一 method+id 在 TTL 秒内只注入一次
dedup_ttl_seconds = 120
dedup_max_size = 8000

# 注入队列上限（超出则丢弃并打日志）；并发协程数
inject_queue_max = 500
inject_concurrency = 8
