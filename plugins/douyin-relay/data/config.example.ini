[relay]
# 运行模式：仅支持 relay（接收 dycast WS 转发）
mode = relay
# relay 模式后端：legacy（手工 dycast）/ sidecar（插件自动托管 dycast）/ native（预留）
relay_backend = sidecar
# 本地 WebSocket 监听地址（在 dycast 的「WS地址」中填写，例如 ws://127.0.0.1:18765/）
listen_host = 127.0.0.1
listen_port = 18765
# HTTP 路径，须与 dycast 填写的 URL 路径一致，一般为 /
ws_path = /
# sidecar 控制服务地址（dycast 由插件自动拉起时使用）
sidecar_host = 127.0.0.1
sidecar_port = 5173
sidecar_start_timeout_seconds = 20
# Node 可执行文件（可填绝对路径；留空/默认时先尝试 dycast/.node 下的便携 Node，再回退系统 node）
sidecar_node_exe = node
# 启动命令支持占位符：{node}、{port}
sidecar_node_cmd = {node} ./node_modules/vite/bin/vite.js --host 127.0.0.1 --port {port}
# sidecar 自动连接可选房间号（留空则仅启动 sidecar，等待管理页手动连接）
douyin_room_id =
# 抖音请求头或 Cookie（用于 sidecar 连接时注入）
douyin_cookie =

# 注入到弹幕内容前的前缀
content_prefix = 

# 除聊天外是否把下列事件降级为文本弹幕
include_gift = true
# 礼物是否用 blivechat 礼物样式（send_gift）；false 时礼物仍为一条文字弹幕
native_gift = true
include_like = false
include_member = true
include_social = true

# 去重：同一 method+id 在 TTL 秒内只注入一次
dedup_ttl_seconds = 120
dedup_max_size = 8000

# 注入队列上限（超出则丢弃并打日志）；并发协程数
inject_queue_max = 500
inject_concurrency = 8
