[relay]
# 运行模式：relay（默认，接收 dycast WS 转发）或 direct（M1: 内置直连 stub）
mode = direct
# 本地 WebSocket 监听地址（在 dycast 的「WS地址」中填写，例如 ws://127.0.0.1:18765/）
listen_host = 127.0.0.1
listen_port = 18765
# HTTP 路径，须与 dycast 填写的 URL 路径一致，一般为 /
ws_path = /
# direct 模式可选直播间号（M1 stub 仅用于透传字段与日志）
douyin_room_id =
# direct 模式是否自动启动客户端
auto_start = true
# direct 模式重连：最大连续失败次数（达到即停止）+ 退避（秒）
direct_max_retries = 5
direct_backoff_base_seconds = 1.0
direct_backoff_max_seconds = 20.0

# 注入到弹幕内容前的前缀
content_prefix = [抖音]

# 除聊天外是否把下列事件降级为文本弹幕
include_gift = true
# 礼物是否用 blivechat 礼物样式（send_gift）；false 时礼物仍为一条文字弹幕
native_gift = true
include_like = false
include_member = true
include_social = true

# 去重：同一 method+id 在 TTL 秒内只注入一次
dedup_ttl_seconds = 120
dedup_max_size = 8000

# 注入队列上限（超出则丢弃并打日志）；并发协程数
inject_queue_max = 500
inject_concurrency = 8
