<h2>呼吸灯修正 — 仅线条呼吸</h2>
<p class="subtitle">去掉大光晕，边框线条本身淡入淡出</p>

<style>
  @keyframes chase {
    0% { --angle: 0deg; }
    100% { --angle: 360deg; }
  }
  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  .chase { position: relative; border-radius: 12px; overflow: hidden; display: inline-block; }
  .chase::before {
    content: ''; position: absolute; inset: -2px; border-radius: 14px; z-index: 0;
    background: conic-gradient(from var(--angle,0deg), var(--dim) 0deg, var(--dim) 270deg, var(--c1) 285deg, var(--c2) 315deg, var(--c1) 340deg, var(--dim) 355deg, var(--dim) 360deg);
    animation: chase 3s linear infinite;
  }
  .chase .inner { position: relative; margin: 2px; border-radius: 11px; z-index: 1; display: inline-block; }

  /* 精简呼吸灯 — 仅边框颜色亮度变化，文字不受影响 */
  @keyframes lineBreathe {
    0%, 100% { border-color: var(--dim); }
    50% { border-color: var(--bright); }
  }
  .breathe-line {
    border-radius: 12px;
    display: inline-block;
    border: 2px solid var(--dim);
    animation: lineBreathe 2.5s ease-in-out infinite;
    padding: 10px 14px;
  }
</style>

<div style="background:#0d0d1a; border-radius:16px; padding:24px; max-width:500px; font-family:system-ui,sans-serif; display:flex; flex-direction:column; gap:16px;">

  <!-- 付费礼物 金色呼吸 -->
