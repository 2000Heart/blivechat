<h2>修正：纯色气泡背景 + 流动霓虹边框</h2>
<p class="subtitle">气泡内纯色，边框流动</p>

<style>
  @keyframes borderFlow {
    0% { --angle: 0deg; }
    100% { --angle: 360deg; }
  }
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  .flow-border {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
  }
  .flow-border::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 14px;
    background: conic-gradient(from var(--angle, 0deg), var(--c1), var(--c2), var(--c1));
    animation: borderFlow 3s linear infinite;
    z-index: 0;
  }
  .flow-border .inner {
    position: relative;
    margin: 2px;
    border-radius: 11px;
    z-index: 1;
  }
</style>
