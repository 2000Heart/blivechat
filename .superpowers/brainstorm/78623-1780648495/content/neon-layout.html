<h2>赛博霓虹 — 每条消息的布局</h2>
<p class="subtitle">用户信息独立一行，气泡只包含聊天内容</p>

<div class="section">
  <div style="background:#0d0d1a; border-radius:16px; padding:20px; max-width:480px; font-family:system-ui,sans-serif;">

    <!-- 普通弹幕 -->
    <div style="margin-bottom:16px;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; padding:0 4px;">
        <div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#00f3ff,#7b2ff7); flex-shrink:0;"></div>
        <span style="color:rgba(255,255,255,0.5);font-size:11px;">14:32</span>
        <span style="color:#00f3ff;font-size:13px;font-weight:600;">用户名</span>
        <span style="background:linear-gradient(90deg,#00f3ff,#7b2ff7);font-size:10px;padding:1px 6px;border-radius:4px;color:#fff;">舰长</span>
      </div>
      <div style="border:1.5px solid rgba(0,243,255,0.3); border-radius:12px; padding:10px 14px; background:rgba(0,243,255,0.04);">
        <span style="color:#e0e0ff;font-size:13px;line-height:1.5;">弹幕内容文本可以很长，自动换行到下一行显示</span>
      </div>
    </div>

    <!-- 高价值弹幕（带动效） -->
    <div style="margin-bottom:8px;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; padding:0 4px;">
        <div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#ff00e5,#ff6600); flex-shrink:0;"></div>
        <span style="color:rgba(255,255,255,0.5);font-size:11px;">14:35</span>
        <span style="color:#ff00e5;font-size:13px;font-weight:600;">高价值用户</span>
        <span style="background:linear-gradient(90deg,#ff00e5,#ff6600);font-size:10px;padding:1px 6px;border-radius:4px;color:#fff;">总督</span>
      </div>
      <div style="border:1.5px solid; border-image:linear-gradient(135deg,#ff00e5,#ff6600) 1; border-radius:12px; padding:10px 14px; background:rgba(255,0,229,0.06); box-shadow:0 0 20px rgba(255,0,229,0.15), inset 0 0 20px rgba(255,0,229,0.03);">
        <span style="color:#f0e0ff;font-size:13px;line-height:1.5; text-shadow:0 0 8px rgba(255,0,229,0.3);">高价值弹幕内容 — 动效发光文字</span>
      </div>
    </div>

  </div>
</div>

<div class="pros-cons" style="margin-top:16px;">
  <div style="flex:1;">
    <h4>设计要点</h4>
    <ul>
      <li>用户信息行：头像 + 时间 + 用户名 + 身份徽章</li>
      <li>气泡只包裹聊天内容，独立于用户信息</li>
      <li>普通弹幕：细霓虹蓝边框，弱背景</li>
      <li>高价值弹幕：霓虹渐变边框 + 发光 + shimmer 动效</li>
      <li>整体深色背景 (#0d0d1a)</li>
    </ul>
  </div>
</div>

<div class="section" style="margin-top:20px;">
  <h3>你觉得这个布局方向如何？</h3>
  <div class="options">
    <div class="option" data-choice="approve" onclick="toggleSelect(this)">
      <div class="letter">✓</div>
      <div class="content"><h3>很好，继续细化</h3><p>布局方向没问题</p></div>
    </div>
    <div class="option" data-choice="adjust" onclick="toggleSelect(this)">
      <div class="letter">!</div>
      <div class="content"><h3>需要调整</h3><p>我想修改一些细节</p></div>
    </div>
  </div>
</div>
