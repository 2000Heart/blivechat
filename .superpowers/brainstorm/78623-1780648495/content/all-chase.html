<h2>单段追光 — 完整色彩一览</h2>
<p class="subtitle">统一使用单段追光效果</p>

<style>
  @keyframes chase {
    0% { --angle: 0deg; }
    100% { --angle: 360deg; }
  }
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  .chase {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
  }
  .chase::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 14px;
    z-index: 0;
    background: conic-gradient(
      from var(--angle, 0deg),
      var(--dim) 0deg,
      var(--dim) 270deg,
      var(--c1) 285deg,
      var(--c2) 315deg,
      var(--c1) 340deg,
      var(--dim) 355deg,
      var(--dim) 360deg
    );
    animation: chase 3s linear infinite;
  }
  .chase .inner {
    position: relative;
    margin: 2px;
    border-radius: 11px;
    z-index: 1;
  }
  /* 大额加速 */
  .chase-fast::before { animation-duration: 1.5s; }
</style>
